[package]
name = "ox"
version = "0.1.0"
edition = "2024"
description = "Local model gateway for stock coding clients and multiple API providers"
publish = false

[features]
test-brave = []

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
crossterm = "0.28.1"
futures-util = "0.3"
getrandom = "0.4"
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
ox-memory = { path = "desktop/ox-memory" }
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls", "stream"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "signal", "time"] }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
unicode-width = "0.2"

# The shipped binary: whole-program optimisation and no symbol table. This
# cuts the download by about 40% and the resident memory by about 1 MiB.
# Panics still unwind, so one failed connection cannot take the relay down.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

# The relay returns ready-made hyper responses as errors and keeps a few
# fixture tuples inline; boxing them would only add allocations.
[lints.clippy]
result_large_err = "allow"
type_complexity = "allow"
