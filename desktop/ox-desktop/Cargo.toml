[package]
name = "ox-desktop"
version = "0.1.0"
edition = "2024"
publish = false
description = "Native workspace for OX and Codex"

[dependencies]
ox-pty = { path = "../ox-pty" }
ox-host-service = { path = "../ox-host-service" }
ox-host-web = { path = "../ox-host-web", features = ["client"] }
base64 = "0.22"
getrandom = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gpui.workspace = true
gpui_platform.workspace = true
ox-desk-core = { path = "../ox-desk-core" }
ox-memory = { path = "../ox-memory" }
gpui-component.workspace = true
# The default icon bundle gpui-component draws (lucide subset); no new crate in the tree.
gpui-kit-assets = "=0.10.0"
flume = { version = "0.12", default-features = false, features = ["async"] }
futures-lite = "2"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
markdown = "1"
shlex = "2"
socket2 = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
raw-window-handle = "0.6"
libc = "0.2"
vt100 = "0.16.2"
tempfile = "3"
notify = "8"
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.19"

[target.'cfg(target_os = "linux")'.dev-dependencies]
ox-host-web = { path = "../ox-host-web", features = ["fixture-transport"] }
