name: OX Desktop

# Full lane: packaged desktop builds, window tests and stock sessions in the
# packaged app. The fast lane (fmt, clippy, unit tests, the Linux workbench
# check and stock-client protocol fixtures) is fast.yml and runs before merge.
#
# When this workflow runs, once per change:
#   - pull request and merge queue: ci.yml requests packaged tests for packaging and window-test
#     changes or the full-ci label. Changes to macOS packaging also run on macOS.
#   - push to main and v* tags: called by ci.yml (job desktop-release) with the
#     release version, all four legs. That call is the only main/tag run, so the
#     packages are built once and published from the same run.
#   - nightly schedule and manual runs: ubuntu-24.04, ubuntu-24.04-arm and
#     macos-26. macos-26-intel runs for tags and release builds only (or a
#     manual run with `intel`).
# Pushes to feature branches do not run this workflow; their pull request does.
#
# macOS signing: the package job signs ad hoc and holds no secrets, because it
# also installs and runs third-party clients. On a release run (and a manual
# run with `sign`) the sign-macos job signs the tested bundles again with
# Developer ID, has Apple notarize them and staples the ticket. Only that job
# enters the apple-release environment, which holds the certificate and the
# App Store Connect API key. Which refs may enter it is that environment's
# deployment rule in the repository settings (main and v* tags); a manual run
# with `sign` works only on a ref that rule admits. The signed archives are
# the ones clean-account installs and the release publishes.
#
# Flake rule: a window test that fails intermittently is quarantined, not
# retried and not deleted. Add it to desktop/ci/quarantine.toml with the
# issue that tracks it (optionally only for the runners where it flakes).
# Window test steps run through desktop/ci/quarantine.py, which skips a
# quarantined test on pull requests and main and runs it, blocking, in the
# nightly schedule, manual runs and tags. Fix the flake, then delete the entry
# and close the issue. Entries expire after at most 30 days, and the fast lane
# rejects an entry without an issue or past its date.
on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
    inputs:
      intel:
        description: Also build and test on macos-26-intel
        type: boolean
        default: false
      sign:
        description: Sign and notarize the macOS packages (needs the apple-release environment)
        type: boolean
        default: false
  workflow_call:
    inputs:
      pr_macos:
        description: Also exercise macOS packaging on this pull request
        type: boolean
        default: false
      full:
        description: Build and test the four platforms main does (the full-ci label)
        type: boolean
        default: false
      build_version:
        required: true
        type: string

permissions:
  contents: read
concurrency:
  # A nightly run must not cancel the release build ci.yml calls on main.
  group: desktop-${{ github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || 'change' }}
  cancel-in-progress: true
env:
  OX_BUILD_SHA: ${{ github.sha }}
  OX_BUILD_VERSION: ${{ inputs.build_version || '' }}
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '3'
  CARGO_TARGET_DIR: desktop/target
  CARGO_PROFILE_RELEASE_STRIP: symbols
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        runner: >-
          ${{ fromJSON(contains(fromJSON('["pull_request","merge_group"]'), github.event_name) && !inputs.full && (inputs.pr_macos && '["ubuntu-24.04","macos-26"]' || '["ubuntu-24.04"]') ||
          (inputs.build_version || inputs.intel) && '["ubuntu-24.04","ubuntu-24.04-arm","macos-26","macos-26-intel"]' ||
          '["ubuntu-24.04","ubuntu-24.04-arm","macos-26"]') }}
    runs-on: ${{ matrix.runner }}
    env:
      OX_RUNNER: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore native dependency build
        id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            desktop/target/release
            !desktop/target/release/incremental
            !desktop/target/release/ox
            !desktop/target/release/ox-desktop
            !desktop/target/release/ox-host
          key: ox-desktop-v1-${{ matrix.runner }}-rust1.100-${{ hashFiles('desktop/Cargo.lock', 'Cargo.lock') }}
          restore-keys: |
            ox-desktop-v1-${{ matrix.runner }}-rust1.100-
      - name: Install Rust
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup default 1.100.0
      - name: Check archive validation and identify the Ubuntu runner image
        id: apt-image
        if: runner.os == 'Linux'
        run: |
          python3 -m unittest discover -s desktop/ci -p test_apt_archives.py
          echo "version=${ImageVersion}-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore downloaded Ubuntu package archives
        id: apt-cache
        if: runner.os == 'Linux'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ox-package-debs/*.deb
          key: ox-apt-v1-${{ matrix.runner }}-${{ runner.arch }}-${{ hashFiles('desktop/ci/linux-deps.sh', 'desktop/ci/apt_archives.py', '.github/workflows/desktop.yml') }}-${{ steps.apt-image.outputs.version }}
          restore-keys: ox-apt-v1-${{ matrix.runner }}-${{ runner.arch }}-
      - name: Install Linux development libraries
        if: runner.os == 'Linux'
        env:
          OX_CACHE_PACKAGE_DEBS: '1'
        run: desktop/ci/linux-deps.sh bubblewrap imagemagick tesseract-ocr fonts-dejavu-core sway grim wtype wl-clipboard fcitx5 fcitx5-chinese-addons dbus-daemon python3-dbus python3-gi
      - name: Save current Ubuntu archives for subsequent builds
        if: runner.os == 'Linux' && github.ref == 'refs/heads/main' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ox-package-debs/*.deb
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      - name: Prepare the Metal compiler
        if: runner.os == 'macOS'
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      # fmt, the contract check and clippy run in the fast lane, which gates
      # every push and every release. Tests run again here in release mode.
      #
      # This job compiles three times and no more: every test of the workspace
      # (here), what ships together with the probe tools (package.sh), and the
      # ox relay, which is a separate workspace. The scripts below take their
      # test executables from OX_TEST_ARTIFACTS (desktop/ci/test-bin.sh)
      # instead of asking cargo for one package at a time, which resolves
      # features differently and compiled the same crates again.
      - name: Build every desktop test once
        run: |
          cargo test --workspace --locked --release --manifest-path desktop/Cargo.toml --no-run \
            --message-format=json-render-diagnostics > "$RUNNER_TEMP/desktop-tests.json"
          echo "OX_TEST_ARTIFACTS=$RUNNER_TEMP/desktop-tests.json" >> "$GITHUB_ENV"
      - run: cargo test --workspace --locked --release --manifest-path desktop/Cargo.toml
      # The shipped binaries are a build of their own: the test build above
      # turns on test-only features (ox-host-web's fixture transport).
      - run: desktop/package.sh -p ox-desk-probe
      - name: Build and verify the macOS drag-to-install image
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          # dmgbuild flushes the mounted filesystem with GNU sync.
          if ! sync --file-system "$work" 2>/dev/null; then
            if ! brew list --versions coreutils; then brew install coreutils; fi
            export PATH="$(brew --prefix coreutils)/libexec/gnubin:$PATH"
          fi
          python3 -m venv "$work/venv"
          "$work/venv/bin/pip" install dmgbuild==2.0.0 ds_store==1.3.4 mac_alias==2.2.4
          archive="ox-desktop-macos-$(uname -m)"
          ditto -x -k "desktop/dist/$archive.zip" "$work/app"
          "$work/venv/bin/dmgbuild" -s desktop/packaging/dmg-settings.py \
            -D "app=$work/app/OX Desktop.app" -D "background=$PWD/desktop/packaging/dmg-background.png" \
            'OX Desktop' "desktop/dist/$archive.dmg"
          desktop/ci/macos-dmg.sh "desktop/dist/$archive.dmg"
          (cd desktop/dist && shasum -a 256 "$archive.dmg" > "$archive.dmg.sha256")
      - name: Exercise gateway service lifecycle with the packaged host
        run: python3 desktop/tests/host_service.py desktop/target/release/ox desktop/target/release/ox-host
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ox-desktop-${{ matrix.runner }}
          path: desktop/dist/ox-desktop-*
          if-no-files-found: error
          compression-level: 0
      - name: Package matching performance tools
        id: probe
        run: tar -czf "$RUNNER_TEMP/desktop-probe.tar.gz" -C desktop/target/release ox-desk-probe fake-app-server fake-claude
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-${{ matrix.runner }}
          path: ${{ runner.temp }}/desktop-probe.tar.gz
          compression-level: 0
      # Stock Codex runs commands in a bubblewrap sandbox with its own network
      # namespace, which the runner image denies to unprivileged users. Every
      # Linux leg runs stock Codex (the linked worker tests among them), so
      # lift the restriction for all of them, not only where protocol.sh runs.
      - name: Allow Codex's bubblewrap sandbox
        if: runner.os == 'Linux'
        run: |
          probe() { bwrap --unshare-net --ro-bind / / --dev /dev --proc /proc true; }
          if ! probe && [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = 1 ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          probe
      - name: Verify the workbench against floor and current stock Codex
        if: matrix.runner == 'ubuntu-24.04'
        env:
          OX_TEST_OX_BIN: ${{ github.workspace }}/desktop/target/release/ox
        run: desktop/ci/protocol.sh
      - name: Exercise Claude subscription and relay sessions in the stock CLI and workbench
        run: desktop/ci/claude-protocol.sh desktop/target/release/ox
      - name: Open the packaged Linux app on X11
        if: runner.os == 'Linux'
        run: python3 desktop/ci/quarantine.py packaged-window -- xvfb-run -a desktop/tests/packaged-window.sh desktop/dist/*.tar.gz
      - name: Prepare isolated Linux window tests
        id: window-tests
        if: runner.os == 'Linux' && !cancelled() && steps.probe.outcome == 'success'
        run: |
          verification=$(mktemp -d)
          tar -xzf desktop/dist/*.tar.gz -C "$verification"
          claude_floor=$(python3 -c 'import tomllib; print(tomllib.load(open("desktop/gate.toml", "rb"))["claude"]["minimum_version"])')
          npm install --prefix "$verification" --no-audit --no-fund "@openai/codex@latest" "@anthropic-ai/claude-code@$claude_floor"
          echo "dir=$verification" >> "$GITHUB_OUTPUT"
      - name: Exercise the packaged local terminal and Tailscale permission recovery
        if: matrix.runner == 'ubuntu-24.04' && !cancelled() && steps.window-tests.outcome == 'success'
        env:
          FIXTURE: ${{ steps.window-tests.outputs.dir }}
        run: |
          python3 desktop/ci/quarantine.py local_terminal_window -- xvfb-run -a -s '-screen 0 1280x900x24' python3 desktop/tests/local_terminal_window.py "$FIXTURE/ox-desktop/ox-desktop"
          python3 desktop/ci/quarantine.py remote_permission_window -- xvfb-run -a -s '-screen 0 1280x900x24' python3 desktop/tests/remote_permission_window.py "$FIXTURE/ox-desktop/ox-desktop"
      - name: Prepare matched headless Chromium and ChromeDriver
        if: runner.os == 'Linux' && !cancelled() && steps.window-tests.outcome == 'success'
        id: browser
        run: desktop/ci/browser-runtime.sh
      - name: Exercise the mobile PWA and signed native desktop client
        if: runner.os == 'Linux' && !cancelled() && steps.browser.outcome == 'success'
        env:
          FIXTURE: ${{ steps.window-tests.outputs.dir }}
          OX_TEST_CARGO_PROFILE: release
        run: |
          export OX_TEST_OX_BIN="$FIXTURE/ox-desktop/ox" OX_TEST_HOST_BIN="$FIXTURE/ox-desktop/ox-host"
          export CODEOX_TEST_CODEX_BIN="$FIXTURE/node_modules/.bin/codex" OX_TEST_CLAUDE_BIN="$FIXTURE/node_modules/.bin/claude"
          desktop/ox-host-web/tests/check.sh
      - name: Exercise desktop continuity through the packaged host
        if: runner.os == 'Linux' && !cancelled() && steps.window-tests.outcome == 'success'
        env:
          FIXTURE: ${{ steps.window-tests.outputs.dir }}
        run: |
          python3 desktop/ci/quarantine.py host_continuity_window -- xvfb-run -a -s '-screen 0 1280x900x24' python3 desktop/tests/host_continuity_window.py \
            "$FIXTURE/ox-desktop/ox-desktop" "$FIXTURE/node_modules/.bin/claude"
      - name: Exercise concurrent stock sessions in the packaged Linux window
        if: runner.os == 'Linux' && !cancelled() && steps.window-tests.outcome == 'success'
        env:
          FIXTURE: ${{ steps.window-tests.outputs.dir }}
        run: |
          python3 desktop/ci/quarantine.py concurrent_window -- xvfb-run -a -s '-screen 0 1280x900x24' python3 desktop/tests/concurrent_window.py \
            "$FIXTURE/ox-desktop/ox-desktop" "$FIXTURE/node_modules/.bin/codex"
      - name: Exercise Codex and Claude together in the packaged Linux workbench
        if: runner.os == 'Linux' && !cancelled() && steps.window-tests.outcome == 'success'
        env:
          FIXTURE: ${{ steps.window-tests.outputs.dir }}
        run: |
          python3 desktop/ci/quarantine.py mixed_runtime_window -- xvfb-run -a -s '-screen 0 1280x900x24' python3 desktop/tests/mixed_runtime_window.py \
            "$FIXTURE/ox-desktop/ox-desktop" "$FIXTURE/node_modules/.bin/codex" "$FIXTURE/node_modules/.bin/claude" \
            --failure-image "$RUNNER_TEMP/mixed-runtime-window.png"
          python3 desktop/ci/quarantine.py native_catalog_window -- xvfb-run -a -s '-screen 0 1280x900x24' python3 desktop/tests/native_catalog_window.py \
            "$FIXTURE/ox-desktop/ox-desktop" "$FIXTURE/node_modules/.bin/codex" "$FIXTURE/node_modules/.bin/claude" \
            --failure-image "$RUNNER_TEMP/native-catalog-window.png"
      - name: Exercise keyboard and IME in the packaged Wayland window
        if: runner.os == 'Linux' && !cancelled() && steps.window-tests.outcome == 'success'
        env:
          FIXTURE: ${{ steps.window-tests.outputs.dir }}
        run: python3 desktop/ci/quarantine.py keyboard_window -- python3 desktop/tests/keyboard_window.py "$FIXTURE/ox-desktop/ox-desktop" "$FIXTURE/node_modules/.bin/codex"
      - name: Measure packaged rendering, interaction and secure entry
        if: runner.os == 'Linux' && !cancelled() && steps.window-tests.outcome == 'success'
        env:
          FIXTURE: ${{ steps.window-tests.outputs.dir }}
        run: |
          # The simulated disconnect must reach the normal recovery screen for an installed CLI.
          export PATH="$FIXTURE/node_modules/.bin:$PATH"
          python3 desktop/ci/quarantine.py gate-x11 -- xvfb-run -a -s '-screen 0 1280x900x24' desktop/target/release/ox-desk-probe gate \
            --app "$FIXTURE/ox-desktop/ox-desktop" --ox "$FIXTURE/ox-desktop/ox" \
            --scenarios G4,G6,G7,G8,G9,G10,G11,G12,reconnect,navigation,layout,remote-access --out "$RUNNER_TEMP/desktop-gate.json"
      - name: Measure packaged restored-thread launch milestones
        if: runner.os == 'Linux' && !cancelled() && steps.window-tests.outcome == 'success'
        env:
          FIXTURE: ${{ steps.window-tests.outputs.dir }}
        run: |
          xvfb-run -a -s '-screen 0 1280x900x24' desktop/target/release/ox-desk-probe gate \
            --app "$FIXTURE/ox-desktop/ox-desktop" --ox "$FIXTURE/ox-desktop/ox" \
            --scenarios restore-thread --restore-samples 1 --out "$RUNNER_TEMP/restore-thread.json"
      - name: Measure packaged Claude sessions on native Linux Wayland
        if: runner.os == 'Linux' && !cancelled() && steps.window-tests.outcome == 'success'
        env:
          FIXTURE: ${{ steps.window-tests.outputs.dir }}
        run: |
          python3 desktop/ci/quarantine.py gate-wayland-claude -- dbus-run-session -- desktop/ci/wayland-smoke.sh --run \
            desktop/target/release/ox-desk-probe gate --wayland --scenarios claude \
            --app "$FIXTURE/ox-desktop/ox-desktop" --ox "$FIXTURE/ox-desktop/ox" \
            --out "$RUNNER_TEMP/claude-gate.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux' && !cancelled()
        with:
          name: gate-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/desktop-gate.json
            ${{ runner.temp }}/desktop-gate.png
            ${{ runner.temp }}/restore-thread.json
            ${{ runner.temp }}/restore-thread.png
            ${{ runner.temp }}/mixed-runtime-window.png
            ${{ runner.temp }}/native-catalog-window.png
            ${{ runner.temp }}/claude-gate.json
            ${{ runner.temp }}/claude-gate.png
            ${{ runner.temp }}/continuity-find.png
            ${{ runner.temp }}/continuity-run.png
          if-no-files-found: warn
      - name: Launch the packaged macOS app
        id: mac-window
        if: runner.os == 'macOS'
        run: |
          verification=$(mktemp -d)
          env HOME="$verification" OX_INSTALL_DIR="$verification/bin" OX_INSTALL_BASE_URL="file://$PWD/desktop/dist" sh install.sh --desktop
          codesign --verify --strict --deep "$verification/Applications/OX Desktop.app"
          set -o pipefail
          swift desktop/tests/packaged-window.swift "$verification/Applications/OX Desktop.app" | tee "$RUNNER_TEMP/mac-window.log"
          if grep -q 'mapped its project window' "$RUNNER_TEMP/mac-window.log"; then
            echo 'visible=true' >> "$GITHUB_OUTPUT"
          else
            reason=$(grep -m1 '^::warning::' "$RUNNER_TEMP/mac-window.log")
            jq -n --arg sha "$GITHUB_SHA" --arg platform "$(uname -m)" --arg reason "${reason#::warning::}" \
              '{commit: $sha, platform: $platform, window_verified: false, reason: $reason}' \
              > "$RUNNER_TEMP/mac-window-unavailable.json"
          fi
          echo "binary=$verification/Applications/OX Desktop.app/Contents/MacOS/ox-desktop" >> "$GITHUB_OUTPUT"
      - name: Record macOS ARM64 startup, idle CPU and open-thread memory
        if: matrix.runner == 'macos-26' && steps.mac-window.outputs.visible == 'true'
        env:
          PACKAGED_GUI: ${{ steps.mac-window.outputs.binary }}
        run: |
          swiftc desktop/tests/gate-key.swift -o "$RUNNER_TEMP/gate-key"
          desktop/target/release/ox-desk-probe gate --scenarios G14 --app "$PACKAGED_GUI" \
            --mac-key-driver "$RUNNER_TEMP/gate-key" --out "$RUNNER_TEMP/desktop-gate.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'macOS' && !cancelled()
        with:
          name: gate-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/desktop-gate.json
            ${{ runner.temp }}/mac-window.log
            ${{ runner.temp }}/mac-window-unavailable.json
      # Keep compiled dependencies even when the application itself fails to build.
      # Only main, tags and nightly runs write the cache: pull request entries
      # would fill the repository's cache quota and evict main's, and every run
      # restores from main.
      - name: Cache native dependency build
        if: "!cancelled() && github.event_name != 'pull_request' && github.event_name != 'merge_group' && steps.deps.outputs.cache-hit != 'true' && steps.deps.outputs.cache-primary-key != ''"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            desktop/target/release
            !desktop/target/release/incremental
            !desktop/target/release/ox
            !desktop/target/release/ox-desktop
            !desktop/target/release/ox-host
          key: ${{ steps.deps.outputs.cache-primary-key }}

  sign-macos:
    name: Sign and notarize macOS packages
    needs: package
    # Release runs called by ci.yml on main and tags, or a manual run with `sign`.
    if: >-
      ${{ !cancelled() && needs.package.result == 'success' &&
      github.event_name != 'pull_request' && github.event_name != 'merge_group' && github.event_name != 'schedule' &&
      (inputs.build_version || inputs.sign) }}
    runs-on: macos-26
    environment: apple-release
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ox-desktop-macos-*
          path: ${{ runner.temp }}/packaged
      - name: Import the Developer ID identity
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
        run: desktop/ci/macos-keychain.sh
      - name: Sign, notarize and staple each architecture
        id: sign
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          found=0
          # One matching artifact is unpacked straight into the path, several
          # into a directory each, so find the archives wherever they landed.
          while IFS= read -r archive; do
            case "${archive##*/}" in
              ox-desktop-macos-arm64.zip) runner=macos-26 ;;
              ox-desktop-macos-x86_64.zip) runner=macos-26-intel ;;
              *) echo "::error::unexpected archive ${archive##*/}"; exit 1 ;;
            esac
            image="${archive%.zip}.dmg"
            (cd "${archive%/*}" && shasum -a 256 --check "${archive##*/}.sha256" "${image##*/}.sha256")
            desktop/ci/macos-notarize.sh "$archive" "$image" "$RUNNER_TEMP/signed/$runner"
            echo "${runner}=true" >> "$GITHUB_OUTPUT"
            found=$((found + 1))
          done < <(find "$RUNNER_TEMP/packaged" -name 'ox-desktop-macos-*.zip' | sort)
          [ "$found" -gt 0 ] || { echo "::error::no packaged macOS archive to sign"; exit 1; }
      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/ox-signing.keychain-db" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ox-desktop-signed-macos-26
          path: ${{ runner.temp }}/signed/macos-26/ox-desktop-*
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # A release run owes both architectures; a manual run may have built one.
        if: steps.sign.outputs.macos-26-intel == 'true' || inputs.build_version
        with:
          name: ox-desktop-signed-macos-26-intel
          path: ${{ runner.temp }}/signed/macos-26-intel/ox-desktop-*
          if-no-files-found: error
          compression-level: 0

  clean-account:
    needs: [package, sign-macos]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(contains(fromJSON('["pull_request","merge_group"]'), github.event_name) && !inputs.full && (inputs.pr_macos && '["ubuntu-24.04","macos-26"]' || '["ubuntu-24.04"]') || '["ubuntu-24.04","macos-26"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A successful package matrix owes this leg a real install. When a package
      # already failed, still exercise the platforms whose artifacts are available.
      - id: package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: ${{ needs.package.result != 'success' }}
        with:
          # On a signing run, macOS installs the archive that ships.
          name: ox-desktop-${{ startsWith(matrix.runner, 'macos') && needs.sign-macos.result != 'skipped' && 'signed-' || '' }}${{ matrix.runner }}
          path: ${{ runner.temp }}/dist
      - name: No package for this platform
        if: steps.package.outcome != 'success'
        run: echo "::notice title=Clean-account install skipped::package (${{ matrix.runner }}) produced no package; see that job."
      - name: Install, restart, crash, upgrade and uninstall as a new account
        if: steps.package.outcome == 'success'
        run: sh desktop/tests/host_clean_account.sh "$RUNNER_TEMP/dist"
